<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Security - Générateur de Badges Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="language-selector no-print">
        <button id="btn-lang">🌐 English</button>
    </div>

    <div class="main-wrapper">
        
        <div class="control-panel no-print">
            <h3 id="panel-title">⚙️ Ajouter un Personnel</h3>
            
            <div class="form-group">
                <label id="label-name" for="input-name">Nom & Prénom :</label>
                <input type="text" id="input-name" placeholder="Ex: Benjamin Mazuya">
            </div>

            <div class="form-group">
                <label id="label-role" for="input-role">Poste / Fonction :</label>
                <input type="text" id="input-role" placeholder="Ex: Directeur Logistique">
            </div>

            <div class="form-group">
                <label id="label-id" for="input-id">Numéro ID :</label>
                <input type="text" id="input-id" placeholder="Ex: #4509">
            </div>

            <div class="form-group">
                <label id="label-text-color" for="input-text-color">Couleur du texte :</label>
                <input type="color" id="input-text-color" value="#1e293b">
            </div>

            <div class="form-group">
                <label id="label-bg-color" for="input-bg-color">Couleur de fond (dégradé) :</label>
                <input type="color" id="input-bg-color" value="#3b82f6">
            </div>

            <div class="form-group">
                <label id="label-bg-image" for="input-bg-image">Ou Image de fond (Optionnel) :</label>
                <input type="file" id="input-bg-image" accept="image/*">
            </div>

            <div class="form-group">
                <label id="label-photo" for="input-photo">Photo de profil :</label>
                <input type="file" id="input-photo" accept="image/*">
            </div>

            <div class="form-group">
                <label id="label-status" for="input-status">Statut initial :</label>
                <select id="input-status">
                    <option value="online">Présent / Actif</option>
                    <option value="meeting">En Réunion</option>
                    <option value="offline">Absent</option>
                </select>
            </div>

            <div class="button-group">
                <button id="btn-add" class="btn-primary">➕ Ajouter à la Planche</button>
                <button id="btn-clear" class="btn-secondary">🗑️ Vider la Planche</button>
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;">
                <button id="btn-print" class="btn-print-action">🖨️ Imprimer la Planche (A4)</button>
                <button id="btn-export-word" style="background-color: #2b579a; color: white; margin-top: 5px;">📝 Exporter pour Microsoft Word</button>
            </div>

            <div class="badge-counter-info">
                Badge(s) prêt(s) : <span id="badge-count">0</span>
            </div>
        </div>

        <div id="print-zone" class="print-zone-grid">
            </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
